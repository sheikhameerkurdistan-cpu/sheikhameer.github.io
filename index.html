
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشيخ امير كردستان - الصفحة الرسمية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .badge {
            display: inline-block;
            background-color: #2da44e;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>الشيخ امير كردستان</h1>
        <p>أهلاً بكم في الصفحة الرسمية. سيتم نشر جديد المنشورات والمحتوى هنا بانتظام.</p>
        <span class="badge">الموقع شغال ومُفعّل</span>
    </div>

</body>
</html>
